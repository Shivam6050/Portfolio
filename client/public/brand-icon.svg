<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>Shivam S monogram</title>
  <desc>A premium glass and metallic S monogram with a warm orange accent.</desc>
  <defs>
    <radialGradient id="orb" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#3a3935"/>
      <stop offset=".55" stop-color="#171715"/>
      <stop offset="1" stop-color="#090908"/>
    </radialGradient>
    <linearGradient id="silver" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".22" stop-color="#d8d2c9"/>
      <stop offset=".5" stop-color="#8e8981"/>
      <stop offset=".72" stop-color="#f3eee7"/>
      <stop offset="1" stop-color="#bcb6ad"/>
    </linearGradient>
    <linearGradient id="orange" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0" stop-color="#ffd0a8"/>
      <stop offset=".35" stop-color="#e8782e"/>
      <stop offset=".72" stop-color="#c24b18"/>
      <stop offset="1" stop-color="#8f2f0e"/>
    </linearGradient>
    <linearGradient id="glass" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#f0a46b" stop-opacity=".10"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="105" fill="#d87934" opacity=".16" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="101" fill="url(#orb)" stroke="#fff" stroke-opacity=".18" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#glass)" stroke-width="3"/>
  <path d="M164 61c-7-10-20-16-34-16-16 0-30 7-38 19-8 12-5 25 8 33l28 18c9 6 10 13 4 19-5 6-13 9-21 9-12 0-22-6-28-16" fill="none" stroke="url(#silver)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M93 195c7 10 20 16 34 16 16 0 30-7 38-19 8-12 5-25-8-33l-28-18c-9-6-10-13-4-19 5-6 13-9 21-9 12 0 22 6 28 16" fill="none" stroke="url(#silver)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M123 123c-7 6-9 14-4 20 5 7 15 12 24 18 11 7 15 17 11 28-3 8-9 15-18 20" fill="none" stroke="url(#orange)" stroke-width="23" stroke-linecap="round"/>
  <path d="M57 79c20-31 59-51 98-40" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 68c25-27 59-36 83-31" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="188" cy="184" r="5" fill="#e8782e"/>
</svg>