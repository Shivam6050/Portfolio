<!-- Use HTML5 standards mode; keep this first declaration. -->
<!doctype html>
<!-- Document language for screen readers/search; change lang if the primary content language changes. -->
<html lang="en">
  <!-- Browser metadata and resource links; visible page content is mounted in body below. -->
  <head>
    <!-- Decode source as UTF-8, including the signature, arrows, and punctuation. -->
    <meta charset="UTF-8" />
    <!-- Use device width and normal initial zoom so responsive CSS breakpoints behave on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Public authorship metadata; this documents attribution but cannot prevent source edits. -->
    <meta name="author" content="Shivam Sagar" />
    <!-- Link to the original author profile; coordinate attribution changes with Footer and COPYRIGHT.txt. -->
    <link rel="author" href="https://github.com/Shivam6050" />
    <!-- Browser chrome color; synchronize with the cream page palette when changing theme. -->
    <meta name="theme-color" content="#f2ede4" />
    <!-- ICO fallback for browsers requesting conventional favicon format; regenerate through scripts/generate-icons.ps1. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- Explicit 32px PNG icon; sizes must match the actual image dimensions. -->
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <!-- Scalable favicon with embedded PNG data, avoiding unreliable external image references inside SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <!-- 180px home-screen icon for Apple devices; regenerate alongside other favicons. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Search/share description; update for public profile copy, without inserting private information. -->
    <meta name="description" content="Shivam Sagar — Full Stack Developer | Backend & AI Engineering" />
    <!-- Browser tab/search title; update when changing the public portfolio identity. -->
    <title>Shivam Sagar — Full Stack Developer</title>
  </head>
  <!-- Visible application host; React inserts page content into root. -->
  <body>
    <!-- React mount point; main.jsx must use the same ID. -->
    <div id="root"></div>
    <!-- ES-module entry resolved/bundled by Vite; keep this path aligned with src/main.jsx. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
